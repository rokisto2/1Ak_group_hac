name: Run Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov testcontainers[postgres,minio]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create test environment files
        run: |
          cat > .env << EOF
          COMPOSE_PROJECT_NAME=1ak-group-hack-test
          
          # Redis
          REDIS_VERSION=7.4.2
          REDIS_CONTAINER=1ak-group-hack-redis-test
          REDIS_PORT=6379
          
          # PostgreSQL
          POSTGRES_VERSION=17.0
          POSTGRES_CONTAINER=1ak-group-hack-postgres-test
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=testuser
          POSTGRES_USER_PASSWORD=testpassword
          POSTGRES_DB=testdb
          
          # MinIO
          MINIO_VERSION=RELEASE.2025-04-08T15-41-24Z-cpuv1
          MINIO_MC_VERSION=RELEASE.2025-04-08T15-39-49Z-cpuv1
          MINIO_CONTAINER=1ak-group-hack-minio-test
          MINIO_ROOT_USER=minioadmin
          MINIO_HOST=localhost
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_API_PORT=9034
          MINIO_WEB_CONSOLE_PORT=9131
          MINIO_BUCKET=1ak-group-hack-bucket
          
          # Files
          TEMP_FILES_DIR=/tmp/temp_send
          EOF
          
          cat > .env-secret << EOF
          # Email settings
          EMAIL_CREDENTIALS_FILE=/tmp/test_credentials.json
          EMAIL_APP_ADDRESS=test@example.com
          EMAIL_APP_NAME=Test App
          EMAIL_TOKEN_PATH=/tmp/test_token.json
          
          # Auth settings
          SECRET_KEY=test_secret_key_for_testing_only_min_32_chars
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          
          # Telegram Bot
          TG_BOT_API_URL=http://localhost:8001
          
          # Frontend
          FRONTEND_ORIGIN=http://localhost:5173
          EOF
          
          # Create dummy email credential files
          echo '{}' > /tmp/test_credentials.json
          echo '{}' > /tmp/test_token.json

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short --cov=main_server --cov-report=term-missing \
            --ignore=tests/services/test_email.py \
            --ignore=tests/services/test_email_schedule_send.py \
            --ignore=tests/services/test_report_delivery_service.py

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
