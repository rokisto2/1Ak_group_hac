networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}

volumes:
  1ak-group-hack-zookeeper:
  1ak-group-hack-kafka:
  1ak-group-hack-minio:
  1ak-group-hack-postgres:
  1ak-group-hack-redis:

services:
  redis:
    image: 'redis:${REDIS_VERSION}'
    container_name: ${REDIS_CONTAINER}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - 1ak-group-hack-redis:/data

  postgres:
    image: 'postgres:${POSTGRES_VERSION}'
    container_name: ${POSTGRES_CONTAINER}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - 1ak-group-hack-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_USER_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

  minio:
    image: 'minio/minio:${MINIO_VERSION}'
    container_name: ${MINIO_CONTAINER}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - 1ak-group-hack-minio:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_WEB_CONSOLE_PORT}:9001"

  minio-init:
    image: 'minio/mc:${MINIO_MC_VERSION}'
    container_name: ${COMPOSE_PROJECT_NAME}-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO to be ready...';
        until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
          echo 'MinIO is not ready yet. Retrying in 2s...';
          sleep 2;
        done;
        echo 'MinIO is ready. Creating bucket if needed...';
        mc mb myminio/${MINIO_BUCKET} || echo 'Bucket already exists';
      "

  # Nginx reverse proxy с HTTPS и балансировкой нагрузки
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - main_server_1
      - main_server_2
      - tg_bot
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped

  # Главный бэкенд - инстанс 1
  main_server_1:
    build:
      context: ..
      dockerfile: docker/main_server/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-main-server-1
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_USER_PASSWORD=${POSTGRES_USER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MINIO_HOST=minio
      - MINIO_API_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  # Главный бэкенд - инстанс 2 (для балансировки нагрузки)
  main_server_2:
    build:
      context: ..
      dockerfile: docker/main_server/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-main-server-2
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_USER_PASSWORD=${POSTGRES_USER_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MINIO_HOST=minio
      - MINIO_API_PORT=9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  # Telegram Bot API
  tg_bot:
    build:
      context: ..
      dockerfile: docker/tg_bot/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-tg-bot
    environment:
      - MAIN_SERVER_URL=http://main_server_1:8000
    restart: unless-stopped

  # Frontend (React + Vite)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    environment:
      - VITE_API_BASE_URL=https://localhost/api
    restart: unless-stopped
